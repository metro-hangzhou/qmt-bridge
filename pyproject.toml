[project]
name = "qmt-bridge"
version = "0.1.0"
description = "QMT broker bridge: 大QMT HTTP + miniQMT xtquant dual-mode"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "loguru>=0.7",
]

[project.optional-dependencies]
server = ["tornado>=6.3"]
dev = ["pytest>=8.0", "responses>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qmt_bridge"]
