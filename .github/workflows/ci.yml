name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system --python ${{ matrix.python-version }}

      - name: pytest + coverage
        run: |
          pytest tests/ -v \
            --cov=qmt_bridge \
            --cov-report=xml \
            --cov-report=term-missing
        env:
          PYTHONPATH: .

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install ruff
        run: uv pip install ruff --system

      - name: ruff check
        run: ruff check qmt_bridge/

      - name: ruff format check
        run: ruff format --check qmt_bridge/
