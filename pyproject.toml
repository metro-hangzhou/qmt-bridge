[project]
name = "qmt-bridge"
version = "0.2.0"
description = "QMT broker bridge: 大QMT HTTP + miniQMT xtquant dual-mode"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "loguru>=0.7",
    "polars>=0.20",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
server = ["tornado>=6.5.7"]
dev = ["pytest>=8.0", "responses>=0.25", "pytest-cov>=5.0"]

[project.scripts]
qmt = "qmt_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qmt_bridge"]
